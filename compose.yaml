name: kevnex
services:
  postgres:
    build: ./infra/postgres
    image: kevnex-postgres:17-pgvector-0.8.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kevnex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kevnex}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5433}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 5s
      retries: 20
  minio:
    build: ./infra/minio
    image: kevnex-minio:2025-10-15
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio_data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres_data:
  minio_data:
